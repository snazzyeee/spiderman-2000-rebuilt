name: Synthetic regression
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --require-hashes -r tools/pipeline/ci-requirements.txt
      - name: Python synthetic fixtures
        run: |
          python -m unittest discover -s tools/reference/tests
          python -m unittest discover -s tools/pipeline/tests
      - name: Install hash-pinned Godot 4.7.2 (MIT)
        run: python tools/pipeline/setup_godot_linux.py
      - name: Guarded import and synthetic traversal
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force staging/validation | Out-Null
          ./tools/pipeline/run_godot.ps1 -Import *> staging/validation/ci-import.log
          ./tools/pipeline/run_godot.ps1 -Headless -TraversalTests *> staging/validation/ci-traversal.log
      - name: Validate reports and report private-asset skip
        run: python tools/pipeline/ci_report.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: synthetic-validation
          path: staging/validation/
          if-no-files-found: error
